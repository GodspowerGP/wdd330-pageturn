<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PageTurn — My Personal Bookshelf & Reading Progress Tracker."
    />
    <title>PageTurn | My Bookshelf & Reading Progress</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="header-container">
        <a href="./index.html" class="brand">
          <svg class="brand-icon" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M19 2H6c-1.2 0-2 .8-2 2v16c0 1.2.8 2 2 2h13c.6 0 1-.4 1-1V3c0-.6-.4-1-1-1zm-1 18H6c-.6 0-1-.4-1-1V5c0-.6.4-1 1-1h12v16zM8 7h8v2H8zm0 4h8v2H8zm0 4h5v2H8z"
            />
          </svg>
          <div class="brand-text">
            <h1>PageTurn</h1>
            <p>Reading Tracker & Author Companion</p>
          </div>
        </a>

        <nav class="site-nav" aria-label="Main Navigation">
          <a href="./index.html" class="nav-link">Search & Discover</a>
          <a href="./tracker.html" class="nav-link active">
            My Bookshelf
            <span id="bookshelf-count-badge" class="badge hide">0</span>
          </a>
        </nav>
      </div>
    </header>

    <main class="main-content">
      <!-- Stats Dashboard -->
      <section class="stats-banner" aria-label="Reading Statistics">
        <div class="stat-card">
          <div class="stat-label">Total Books Saved</div>
          <div id="stat-total" class="stat-value">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Currently Reading</div>
          <div id="stat-reading" class="stat-value">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Completed</div>
          <div id="stat-completed" class="stat-value">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Pages Logged</div>
          <div id="stat-pages" class="stat-value">0</div>
        </div>
      </section>

      <!-- Shelf Filter Tabs -->
      <nav class="shelf-tabs" aria-label="Bookshelf Filter">
        <button type="button" class="shelf-tab active" data-shelf="all">All Books</button>
        <button type="button" class="shelf-tab" data-shelf="reading">Currently Reading</button>
        <button type="button" class="shelf-tab" data-shelf="want">Want to Read</button>
        <button type="button" class="shelf-tab" data-shelf="completed">Completed</button>
      </nav>

      <!-- Saved Books Grid -->
      <section>
        <div id="bookshelf-grid" class="book-grid" aria-live="polite">
          <!-- Populated dynamically by tracker.js -->
        </div>
      </section>
    </main>

    <!-- Author Bio & Details Modal -->
    <div id="author-modal" class="modal-overlay hide" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-card">
        <button type="button" id="modal-close-btn" class="modal-close" aria-label="Close dialog">✕</button>
        <div id="modal-content"></div>
      </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <footer class="site-footer">
      <p>
        &copy; 2026 PageTurn &bull; WDD 330 Final Project &bull; Built with Vanilla JavaScript &amp; Open APIs by
        Ulonna Godspower
      </p>
    </footer>

    <script type="module" src="./js/tracker.js"></script>
  </body>
</html>
